name: Repair provider catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: repair provider catalog migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair db catalog
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/db.ts')
          s = p.read_text(encoding='utf-8')

          # Remove Cerebras from the built-in provider catalog.
          import re
          s = re.sub(r"\n  \{\n    id: 'cerebras',[\s\S]*?\n  \},", "", s, count=1)

          # Remove Cerebras built-in model(s), including the stale model kept
          # in IndexedDB by previous builds.
          s = re.sub(r"\n  // cerebras\.ai free-tier model currently listed by Cerebras\n  \{\n    id: 'gpt-oss-120b',[\s\S]*?\n  \},", "", s, count=1)
          s = s.replace("  // Groq free-tier models\n  // Cerebras free API models\n", "")

          # Treat Cerebras as a removed provider so existing IndexedDB records
          # are purged on the next app load.
          s = s.replace(
              "const REMOVED_DEFAULT_PROVIDER_IDS = new Set(['anthropic', 'moonshot', 'qwen', 'siliconflow']);",
              "const REMOVED_DEFAULT_PROVIDER_IDS = new Set(['anthropic', 'moonshot', 'qwen', 'siliconflow', 'cerebras']);"
          )

          # IMPORTANT: older installations already have providers stored in
          # IndexedDB. The old getProviders() only sorted those records, so a
          # newly-added Groq provider was never inserted when the DB was
          # already initialized. Always reconcile missing built-in providers.
          needle = """      if (results.length === 0) {\n        localStorage.setItem('omnichat_db_initialized', 'true');"""
          replacement = """      // Reconcile the built-in provider catalog even when IndexedDB was initialized by an older build.\n      const missingProviders = DEFAULT_PROVIDERS.filter(dp => !results.some(p => p.id === dp.id));\n      for (const provider of missingProviders) {\n        store.put(provider);\n        results.push(provider);\n      }\n\n      if (results.length === 0) {\n        localStorage.setItem('omnichat_db_initialized', 'true');"""
          if needle not in s:
              raise SystemExit('provider reconciliation insertion point not found')
          s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit repaired catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/db.ts .github/workflows/fix-provider-catalog.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair provider catalog migration"
          git push
