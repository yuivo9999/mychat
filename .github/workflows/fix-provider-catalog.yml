name: Repair provider catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: repair provider catalog migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair db catalog
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/services/db.ts')
          s = p.read_text(encoding='utf-8')

          # Remove Cerebras from the built-in provider catalog.
          s = re.sub(r"\n  \{\n    id: 'cerebras',[\s\S]*?\n  \},", "", s, count=1)

          # Remove Cerebras built-in model.
          s = re.sub(r"\n  // cerebras\.ai free-tier model currently listed by Cerebras\n  \{\n    id: 'gpt-oss-120b',[\s\S]*?\n  \},", "", s, count=1)
          s = s.replace("  // Groq free-tier models\n  // Cerebras free API models\n", "")

          # Purge stale Cerebras records from existing IndexedDB installations.
          old = "const REMOVED_DEFAULT_PROVIDER_IDS = new Set(['anthropic', 'moonshot', 'qwen', 'siliconflow']);"
          new = "const REMOVED_DEFAULT_PROVIDER_IDS = new Set(['anthropic', 'moonshot', 'qwen', 'siliconflow', 'cerebras']);"
          if old in s:
              s = s.replace(old, new, 1)

          # Existing users already have providers stored in IndexedDB. Reconcile
          # missing built-in providers so Groq is inserted into old databases.
          needle = "      if (results.length === 0) {\n        localStorage.setItem('omnichat_db_initialized', 'true');"
          replacement = """      const missingProviders = DEFAULT_PROVIDERS.filter(dp => !results.some(p => p.id === dp.id));
          for (const provider of missingProviders) {
            store.put(provider);
            results.push(provider);
          }

          if (results.length === 0) {
            localStorage.setItem('omnichat_db_initialized', 'true');"""
          if needle not in s:
              raise SystemExit('provider reconciliation insertion point not found')
          s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/db.ts .github/workflows/fix-provider-catalog.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair provider catalog migration"
          git push
