name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Integrate verified free AI models into runtime catalog
        run: python3 scripts/integrate-free-models.py

      - name: Repair model database service and provider migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/db.ts')
          s = p.read_text(encoding='utf-8')

          # The previous catalog migration accidentally removed core db.ts exports.
          # Restore them idempotently so the application can build and the browser
          # database keeps working normally.
          if 'export async function getConversations()' not in s:
              marker = "export const DEFAULT_API_KEYS: ApiKeyConfig[] = ["
              block = r'''export async function getConversations(): Promise<Conversation[]> {
            const db = await openDB();
            return new Promise((resolve, reject) => {
              const transaction = db.transaction('conversations', 'readonly');
              const store = transaction.objectStore('conversations');
              const request = store.getAll();
              request.onsuccess = () => {
                const list = (request.result as Conversation[]) || [];
                list.sort((a, b) => b.updatedAt - a.updatedAt);
                resolve(list);
              };
              request.onerror = () => reject(request.error);
            });
          }

          export async function getConversation(id: string): Promise<Conversation | null> {
            const db = await openDB();
            return new Promise((resolve, reject) => {
              const request = db.transaction('conversations', 'readonly').objectStore('conversations').get(id);
              request.onsuccess = () => resolve(request.result || null);
              request.onerror = () => reject(request.error);
            });
          }

          export async function saveConversation(conversation: Conversation): Promise<void> {
            const db = await openDB();
            return new Promise((resolve, reject) => {
              const request = db.transaction('conversations', 'readwrite').objectStore('conversations').put(conversation);
              request.onsuccess = () => resolve();
              request.onerror = () => reject(request.error);
            });
          }

          export async function deleteConversation(id: string): Promise<void> {
            const db = await openDB();
            return new Promise((resolve, reject) => {
              const request = db.transaction('conversations', 'readwrite').objectStore('conversations').delete(id);
              request.onsuccess = () => resolve();
              request.onerror = () => reject(request.error);
            });
          }

          export async function clearAllConversations(): Promise<void> {
            const db = await openDB();
            return new Promise((resolve, reject) => {
              const request = db.transaction('conversations', 'readwrite').objectStore('conversations').clear();
              request.onsuccess = () => resolve();
              request.onerror = () => reject(request.error);
            });
          }

          '''
              if marker not in s:
                  raise SystemExit('conversation insertion marker not found')
              s = s.replace(marker, block + marker, 1)

          if 'export const DEFAULT_SETTINGS: UserSettings = {' not in s:
              marker = '// Open IndexedDB instance'
              block = r'''export const DEFAULT_SETTINGS: UserSettings = {
            theme: 'system',
            fontSize: 'standard',
            enterToSend: true,
            autoScroll: true,
            showTimestamps: true,
            showModelName: true,
            enableStreaming: true,
            enableMarkdown: true,
            enableCodeHighlight: true,
            defaultProviderId: 'nvidia',
            defaultModelId: 'deepseek-ai/deepseek-v4.1-flash',
            defaultSystemPrompt: '你是一个知识渊博、表达严谨、思维敏捷的专业 AI 助手。请用清晰、结构化并得体的语言回答用户的问题。在提供代码时，请提供完整可执行的高质量代码，并附有必要解释。',
            requestTimeout: 60,
            sidebarOpen: true,
          };

          '''
              if marker not in s:
                  raise SystemExit('settings insertion marker not found')
              s = s.replace(marker, block + marker, 1)

          # Remove the old Cerebras/Ollama records and ensure Groq is present in
          # already-initialized IndexedDB stores. This is deliberately idempotent.
          if 'const REMOVED_DEFAULT_PROVIDER_IDS' in s:
              s = s.replace(
                  "const REMOVED_DEFAULT_PROVIDER_IDS = new Set(['anthropic', 'moonshot', 'qwen', 'siliconflow']);",
                  "const REMOVED_DEFAULT_PROVIDER_IDS = new Set(['anthropic', 'moonshot', 'qwen', 'siliconflow', 'cerebras', 'ollama']);"
              )

          needle = "      let results = (request.result as ProviderDefinition[]) || [];"
          if needle in s and "const requiredDefaultProviders = DEFAULT_PROVIDERS.filter" not in s:
              replacement = needle + r'''

              // Reconcile the persisted catalog with the current built-in catalog.
              // This also repairs old browsers where Groq was added after first launch.
              const staleProviderIds = new Set(['cerebras', 'ollama', 'anthropic', 'moonshot', 'qwen', 'siliconflow']);
              for (const provider of results) {
                if (staleProviderIds.has(provider.id)) store.delete(provider.id);
              }
              results = results.filter(p => !staleProviderIds.has(p.id));
              const requiredDefaultProviders = DEFAULT_PROVIDERS.filter(
                p => !results.some(r => r.id === p.id)
              );
              for (const provider of requiredDefaultProviders) {
                store.put(provider);
                results.push(provider);
              }'''
              s = s.replace(needle, replacement, 1)

          # Remove Cerebras model records even if the old provider migration left them.
          model_needle = "      let results = (request.result as ModelItem[]) || [];"
          if model_needle in s and "staleProviderIds.has(r.providerId)" not in s:
              s = s.replace(
                  model_needle,
                  model_needle + "\n\n      const staleProviderIds = new Set(['cerebras', 'ollama']);\n      for (const model of results) { if (staleProviderIds.has(model.providerId)) store.delete(model.id); }\n      results = results.filter(r => !staleProviderIds.has(r.providerId));",
                  1
              )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Persist runtime catalog and database repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/services/db.ts; then
            echo 'Database service already repaired.'
          else
            git add src/services/db.ts
            git commit -m 'fix: restore database exports and Groq migration'
            git push
          fi

      - name: Build project
        run: npm run build

      - name: Create 404.html and .nojekyll fallback for SPA routing
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
